<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>이끼숲 이슬이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one-screen pocket pet. Status strip on top, the terrarium photo fills the middle, a chat bar at the bottom. Single dark look like a jar under a grow light. */
:root{
  --bg:#0d1310;          /* night moss */
  --panel:#16201b;
  --line:#25332b;
  --fg:#e7efe4;
  --muted:#9aab9f;
  --teal:#4fd1bf;        /* raincoat */
  --teal-ink:#06302a;
  --moss:#a6d65a;
  --boot:#f08aa6;
  --bubble:#fbfdf8;
  --bubble-ink:#1d2a22;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:420px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* status strip */
.top{display:flex;align-items:center;gap:10px;padding-block:10px 8px;min-width:0}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.name{font-family:var(--display);font-size:22px;line-height:1.1;background:none;border:0;padding:0;text-align:left;color:var(--fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-input{font-family:var(--display);font-size:20px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:2px 8px;width:9em}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:3px}
.drops{display:flex;gap:3px}
.drops i{width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--line);display:block;transform:rotate(180deg)}
.drops i.on{background:var(--teal)}
.state{padding:1px 7px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;letter-spacing:.02em}
.tools{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed="false"] svg{stroke:var(--muted)}
.ibtn:focus-visible,.send:focus-visible,.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* stage */
.stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.quake{animation:quake .5s linear}
.photo{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.zoomer{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.zoomer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;pointer-events:none}
.figure{position:absolute;aspect-ratio:100/150;transform:translate(-50%,-100%);cursor:pointer}
.figure svg{width:100%;height:100%;overflow:visible;display:block}
.adjusting .figure{outline:1.5px dashed var(--teal);outline-offset:3px;border-radius:6px}
.spawn{animation:spawn .9s cubic-bezier(.2,1.4,.4,1)}

.bubble{position:absolute;z-index:5;max-width:min(240px,70%);background:var(--bubble);color:var(--bubble-ink);padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .2s,transform .2s;word-break:keep-all;overflow-wrap:anywhere}
.bubble.show{opacity:1;transform:none}
.bubble.small{font-size:13px;color:#5b6b60;font-style:italic}
.bubble::after{content:"";position:absolute;bottom:-7px;left:var(--tail,50%);width:14px;height:14px;background:var(--bubble);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#7a8a7f;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}

.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(13,19,16,.82);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:13px;white-space:nowrap;z-index:6;pointer-events:none}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(13,19,16,.9);border:1px solid var(--line);padding:7px 12px;border-radius:12px;font-size:12.5px;max-width:90%;text-align:center;z-index:7;transition:opacity .3s}
.mine{position:absolute;right:12px;bottom:12px;max-width:70%;background:var(--teal);color:var(--teal-ink);padding:7px 12px;border-radius:14px 14px 4px 14px;font-size:14px;z-index:6;transition:opacity .4s,transform .4s}
.mine.fade{opacity:0;transform:translateY(-8px)}

/* bottom */
.bottom{padding-block:10px 12px}
.chat{display:flex;gap:8px;align-items:center}
.chat input{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 16px;font:inherit;font-size:16px}
.chat input:focus{outline:none;border-color:var(--teal)}
.send{height:46px;min-width:46px;border-radius:23px;border:0;background:var(--teal);color:var(--teal-ink);font-family:var(--display);font-size:16px;padding:0 16px;cursor:pointer}
.mic{background:var(--panel);border:1px solid var(--line);padding:0;width:46px}
.mic svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round}
.mic.on{background:var(--boot);border-color:var(--boot)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.adjust{display:grid;gap:10px}
.adjust p{margin:0;font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row label{font-size:13px;color:var(--muted);flex:none}
.row input[type=range]{flex:1;accent-color:var(--teal)}
.ghost{height:42px;border-radius:21px;border:1px solid var(--line);background:none;padding:0 14px;cursor:pointer;font-size:14px}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px}
.sheet ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45}
.sheet li b{color:var(--teal);font-weight:400;font-family:var(--display);margin-right:6px}
.sheet .note{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.5}

/* ---------- figure rig ---------- */
.fig .rig{transform-origin:50px 146px}
.fig .breath{transform-origin:50px 146px;animation:breathe 3.2s ease-in-out infinite}
.fig .head{transform-origin:50px 70px;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.fig .pupils{transition:transform .35s}
.fig .armR{transform-origin:66px 78px;transition:transform .3s}
.fig .armL{transform-origin:34px 78px;transition:transform .3s}
.fig .set{display:none}
.fig[data-eyes="open"] .e-open,.fig[data-eyes="closed"] .e-closed,.fig[data-eyes="happy"] .e-happy,.fig[data-eyes="dizzy"] .e-dizzy,.fig[data-eyes="wide"] .e-wide,.fig[data-eyes="love"] .e-love,.fig[data-eyes="half"] .e-half{display:inline}
.fig[data-mouth="smile"] .m-smile,.fig[data-mouth="grin"] .m-grin,.fig[data-mouth="open"] .m-open,.fig[data-mouth="o"] .m-o,.fig[data-mouth="flat"] .m-flat,.fig[data-mouth="sad"] .m-sad,.fig[data-mouth="wavy"] .m-wavy{display:inline}
.fig[data-brows="sad"] .b-sad,.fig[data-brows="angry"] .b-angry,.fig[data-brows="up"] .b-up{display:inline}
.fig .e-open{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.fig.blink .e-open{transform:scaleY(.1)}
.fig .cheeks{opacity:.55;transition:opacity .3s}
.fig.blush .cheeks{opacity:1}
.fig.look-l .pupils{transform:translateX(-2px)}
.fig.look-r .pupils{transform:translateX(2px)}
.fig.look-u .pupils{transform:translate(1px,-1.6px)}
.fig.tilt-l .head{transform:rotate(-9deg)}
.fig.tilt-r .head{transform:rotate(8deg)}
.fig.nod .head{animation:nod .55s ease-in-out 2}
.fig.nod1 .head{animation:nod .5s ease-in-out 1}
.fig.hop .rig{animation:hop .5s cubic-bezier(.3,.6,.4,1)}
.fig.wave .armR{animation:wave .38s ease-in-out 4}
.fig.arms-up .armL{transform:rotate(28deg)}.fig.arms-up .armR{transform:rotate(-28deg)}
.fig.asleep .head{transform:rotate(11deg) translateY(2px)}
.fig.asleep .breath{animation-duration:4.6s}
.fig.drowsy .head{animation:drowse 3s ease-in-out infinite}
.fig.dizzy .rig{animation:wobble .55s ease-in-out infinite}
.fig.angry .rig{animation:stomp .25s ease-in-out 3}
.fig .fx{display:none}
.fig.asleep .zzz{display:inline}
.fig.dizzy .stars{display:inline}
.fig.thinking .qmark{display:inline}
.fig.loving .hearts{display:inline}
.fig.angry .puff{display:inline}
.fig.shocked .shock{display:inline}
.zzz text{font-family:var(--display);fill:#d8f2ff;animation:zfloat 2.6s ease-in infinite;opacity:0}
.zzz text:nth-child(2){animation-delay:.9s}.zzz text:nth-child(3){animation-delay:1.8s}
.stars{transform-origin:50px 6px;animation:spin 1s linear infinite}
.qmark text{font-family:var(--display);fill:#fff2a8}
.qmark{animation:bob 1s ease-in-out infinite}
.hearts path{animation:hfloat 1.6s ease-out infinite;opacity:0}
.hearts path:nth-child(2){animation-delay:.55s}.hearts path:nth-child(3){animation-delay:1.1s}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.025)}}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}45%{transform:rotate(4deg) translateY(3.5px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-16px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.04,.95)}}
@keyframes wave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-70deg)}}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drowse{0%,100%{transform:rotate(2deg) translateY(0)}60%{transform:rotate(8deg) translateY(2px)}70%{transform:rotate(1deg) translateY(-1px)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hfloat{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.1)}}
@keyframes quake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-.6deg)}40%{transform:translateX(6px) rotate(.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes spawn{0%{opacity:0;transform:translate(-50%,-100%) scale(.4)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.fig .breath,.fig.drowsy .head,.fig.dizzy .rig,.stars{animation:none}.stage.quake{animation:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="who">
      <button class="name" id="name" title="이름 바꾸기">이슬이</button>
      <div class="meta"><span class="drops" id="drops" aria-label="기분"></span><span class="state" id="state">깨어 있음</span></div>
    </div>
    <div class="tools">
      <button class="ibtn" id="btnCam" title="테라리움 사진 찍기" aria-label="사진 찍기"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
      <button class="ibtn" id="btnZoom" title="가까이 보기" aria-label="가까이 보기" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg></button>
      <button class="ibtn" id="btnSound" title="목소리 켜기/끄기" aria-label="목소리" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="w" d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></svg></button>
      <button class="ibtn" id="btnHelp" title="놀이 방법" aria-label="놀이 방법"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 1 1 3.2 2.1c-.7.3-1 .8-1 1.5v.4M12 16.6v.2"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="photo" id="photo">
      <div class="zoomer" id="zoomer">
        <img id="bg" alt="테라리움 사진">
        <div class="figure" id="figure">
          <svg viewBox="0 0 100 150" class="fig" id="fig" data-eyes="open" data-mouth="smile" data-brows="none" aria-label="피규어">
            <ellipse cx="50" cy="146" rx="21" ry="3.6" fill="rgba(0,0,0,.35)"/>
            <g class="rig"><g class="breath">
              <!-- boots -->
              <rect x="37" y="127" width="11" height="17" rx="4.5" fill="#f08aa6"/>
              <rect x="52" y="127" width="11" height="17" rx="4.5" fill="#f08aa6"/>
              <rect x="37" y="139" width="11" height="5" rx="2.5" fill="#d96a8a"/>
              <rect x="52" y="139" width="11" height="5" rx="2.5" fill="#d96a8a"/>
              <!-- coat -->
              <path d="M50 64C39 64 33 72 31 90L25 129Q50 137 75 129L69 90C67 72 61 64 50 64Z" fill="#45cbb7" stroke="#259a8a" stroke-width="1.4"/>
              <path d="M50 70V132" stroke="#259a8a" stroke-width="1.2"/>
              <circle cx="53" cy="86" r="1.5" fill="#259a8a"/><circle cx="53" cy="100" r="1.5" fill="#259a8a"/><circle cx="53" cy="114" r="1.5" fill="#259a8a"/>
              <path d="M28 120Q50 127 72 120" stroke="#5fe0cc" stroke-width="1.2" fill="none" opacity=".6"/>
              <!-- arms -->
              <g class="armL"><path d="M36 74Q25 90 27 108Q31 113 35.5 108.5Q36 93 41 80Z" fill="#3dbfac" stroke="#259a8a" stroke-width="1.2"/><circle cx="30.5" cy="110" r="4" fill="#fde1cc"/></g>
              <g class="armR"><path d="M64 74Q75 90 73 108Q69 113 64.5 108.5Q64 93 59 80Z" fill="#3dbfac" stroke="#259a8a" stroke-width="1.2"/><circle cx="69.5" cy="110" r="4" fill="#fde1cc"/></g>
              <!-- head -->
              <g class="head">
                <path d="M50 4C72 4 83 20 83 40C83 60 70 72 50 72C30 72 17 60 17 40C17 20 28 4 50 4Z" fill="#45cbb7" stroke="#259a8a" stroke-width="1.4"/>
                <path d="M50 4C56 4 61 6 64 9" stroke="#7ff0de" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
                <ellipse cx="50" cy="46" rx="22.5" ry="21.5" fill="#fde5d2" stroke="#259a8a" stroke-width="2.6"/>
                <path d="M28.5 42C29 27 39 22.5 50 22.5C61 22.5 71 27 71.5 42C67 34 61 31 56 35C52.5 29.5 46 29.5 43 34C38 30.5 32 34 28.5 42Z" fill="#9a5432"/>
                <path d="M36 30Q42 27 48 28" stroke="#c07a52" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <g class="cheeks"><ellipse cx="36.5" cy="54" rx="4.2" ry="2.6" fill="#f59aa2"/><ellipse cx="63.5" cy="54" rx="4.2" ry="2.6" fill="#f59aa2"/></g>
                <!-- brows -->
                <g class="set b-sad" stroke="#7a4128" stroke-width="1.5" stroke-linecap="round"><path d="M37 41L44 39"/><path d="M63 41L56 39"/></g>
                <g class="set b-angry" stroke="#7a4128" stroke-width="1.6" stroke-linecap="round"><path d="M37 39L44 42"/><path d="M63 39L56 42"/></g>
                <g class="set b-up" stroke="#7a4128" stroke-width="1.4" stroke-linecap="round"><path d="M37.5 39Q41 36.5 44.5 38.5"/><path d="M62.5 39Q59 36.5 55.5 38.5"/></g>
                <!-- eyes -->
                <g class="pupils">
                  <g class="set e-open"><ellipse cx="41" cy="47.5" rx="3.3" ry="4.3" fill="#2e2222"/><ellipse cx="59" cy="47.5" rx="3.3" ry="4.3" fill="#2e2222"/><circle cx="42.2" cy="45.9" r="1.2" fill="#fff"/><circle cx="60.2" cy="45.9" r="1.2" fill="#fff"/></g>
                  <g class="set e-wide"><circle cx="41" cy="47.5" r="4.8" fill="#fff" stroke="#2e2222" stroke-width="1"/><circle cx="59" cy="47.5" r="4.8" fill="#fff" stroke="#2e2222" stroke-width="1"/><circle cx="41" cy="47.5" r="2.3" fill="#2e2222"/><circle cx="59" cy="47.5" r="2.3" fill="#2e2222"/></g>
                  <g class="set e-half"><path d="M37.6 47.5Q41 52 44.4 47.5Z" fill="#2e2222"/><path d="M55.6 47.5Q59 52 62.4 47.5Z" fill="#2e2222"/><path d="M37 47.3H45M55 47.3H63" stroke="#2e2222" stroke-width="1.3" stroke-linecap="round"/></g>
                </g>
                <g class="set e-closed" stroke="#2e2222" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M37 47.5Q41 51 45 47.5"/><path d="M55 47.5Q59 51 63 47.5"/></g>
                <g class="set e-happy" stroke="#2e2222" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M37 49.5Q41 44 45 49.5"/><path d="M55 49.5Q59 44 63 49.5"/></g>
                <g class="set e-dizzy" stroke="#2e2222" stroke-width="1.2" fill="none" stroke-linecap="round"><path d="M41 47.5m-4 0a4 4 0 1 1 4 4a2.8 2.8 0 1 1 -2.8 -2.8a1.4 1.4 0 1 1 1.4 1.4"/><path d="M59 47.5m-4 0a4 4 0 1 1 4 4a2.8 2.8 0 1 1 -2.8 -2.8a1.4 1.4 0 1 1 1.4 1.4"/></g>
                <g class="set e-love" fill="#e8455f"><path d="M41 51.5l-3.9-3.8a2.3 2.3 0 0 1 3.9-2.4a2.3 2.3 0 0 1 3.9 2.4z"/><path d="M59 51.5l-3.9-3.8a2.3 2.3 0 0 1 3.9-2.4a2.3 2.3 0 0 1 3.9 2.4z"/></g>
                <!-- mouths -->
                <path class="set m-smile" d="M46.5 57Q50 60 53.5 57" stroke="#9b3a44" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path class="set m-grin" d="M45 56Q50 64 55 56Z" fill="#b8434f"/>
                <ellipse class="set m-open" cx="50" cy="58.4" rx="3.2" ry="3.4" fill="#b8434f"/>
                <ellipse class="set m-o" cx="50" cy="58.5" rx="1.9" ry="2.1" fill="#b8434f"/>
                <path class="set m-flat" d="M47 58.3H53" stroke="#9b3a44" stroke-width="1.5" stroke-linecap="round"/>
                <path class="set m-sad" d="M46.5 59.5Q50 56.4 53.5 59.5" stroke="#9b3a44" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path class="set m-wavy" d="M45 58.5q1.25-2 2.5 0t2.5 0t2.5 0t2.5 0" stroke="#9b3a44" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                <!-- head fx -->
                <g class="fx puff" fill="#fff" opacity=".9"><circle cx="76" cy="22" r="3"/><circle cx="80" cy="18" r="2.2"/><circle cx="83" cy="14.5" r="1.5"/></g>
                <g class="fx shock" stroke="#fff2a8" stroke-width="1.6" stroke-linecap="round"><path d="M22 14l-4-4M26 9l-1-5M18 20l-5-1"/></g>

const SAMPLE_POS = { x: 0.351, y: 0.637, size: 13 };
const $ = (s) => document.querySelector(s);
const now = () => performance.now();
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- saved state ---------- */
const S = { name: "이슬이", mood: 70, photo: null, x: SAMPLE_POS.x, y: SAMPLE_POS.y, size: SAMPLE_POS.size, sound: true };
try { Object.assign(S, JSON.parse(localStorage.getItem("terra-pet") || "{}")); } catch (e) {}
function save() {
  try { localStorage.setItem("terra-pet", JSON.stringify(S)); }
  catch (e) { try { localStorage.setItem("terra-pet", JSON.stringify({ ...S, photo: null })); } catch (_) {} }
}

const fig = $("#fig"), figure = $("#figure"), bubble = $("#bubble"), stage = $("#stage"), photo = $("#photo"), zoomer = $("#zoomer"), bg = $("#bg");

/* ---------- photo fit ---------- */
let ar = 720 / 1126;
function fit() {
  const r = stage.getBoundingClientRect();
  let w = r.width, h = r.width / ar;
  if (h > r.height) { h = r.height; w = h * ar; }
  photo.style.width = w + "px"; photo.style.height = h + "px";
  placeFigure();
}
function placeFigure() {
  figure.style.left = S.x * 100 + "%";
  figure.style.top = S.y * 100 + "%";
  figure.style.height = S.size + "%";
  zoomer.style.transformOrigin = S.x * 100 + "% " + (S.y - S.size / 200) * 100 + "%";
  if (bubble.classList.contains("show")) posBubble();
}
bg.onload = () => { ar = bg.naturalWidth / bg.naturalHeight; fit(); };
bg.src = S.photo || SAMPLE_BG;
new ResizeObserver(fit).observe(stage);

/* ---------- face + pose ---------- */
const EMO = {
  neutral: ["open", "smile", "none"], happy: ["happy", "grin", "none"], sad: ["open", "sad", "sad"],
  surprised: ["wide", "o", "up"], love: ["love", "grin", "none"], shy: ["happy", "smile", "none"],
  thinking: ["open", "flat", "up"], sleepy: ["half", "o", "none"], angry: ["open", "flat", "angry"],
  dizzy: ["dizzy", "wavy", "none"], sleep: ["closed", "o", "none"]
};
let emo = "neutral";
function setFace(name) {
  emo = EMO[name] ? name : "neutral";
  const [e, m, b] = EMO[emo];
  fig.dataset.eyes = e; fig.dataset.mouth = m; fig.dataset.brows = b;
  fig.classList.toggle("blush", emo === "shy" || emo === "love");
  fig.classList.toggle("loving", emo === "love");
  fig.classList.toggle("angry", emo === "angry");
  fig.classList.toggle("thinking", emo === "thinking");
}
const pulses = {};
function pulse(cls, ms) {
  fig.classList.remove(cls); void fig.getBoundingClientRect(); fig.classList.add(cls);
  clearTimeout(pulses[cls]); pulses[cls] = setTimeout(() => fig.classList.remove(cls), ms);
}
function look(dir, ms = 1200) {
  fig.classList.remove("look-l", "look-r", "look-u");
  if (dir) pulse("look-" + dir, ms);
}

/* ---------- mood + mode ---------- */
let mode = "awake"; // awake | drowsy | asleep | dizzy
let lastTouch = now();
function renderStatus() {
  const n = Math.round(S.mood / 20);
  $("#drops").innerHTML = Array.from({ length: 5 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
  $("#state").textContent = { awake: "깨어 있음", drowsy: "꾸벅꾸벅", asleep: "자는 중", dizzy: "어지러움" }[mode];
  $("#name").textContent = S.name;
  $("#msg").placeholder = S.name + "에게 말 걸기";
}
function mood(d) { S.mood = clamp(S.mood + d, 0, 100); renderStatus(); save(); }
function setMode(m) {
  mode = m;
  fig.classList.toggle("asleep", m === "asleep");
  fig.classList.toggle("drowsy", m === "drowsy");
  fig.classList.toggle("dizzy", m === "dizzy");
  if (m === "asleep") setFace("sleep");
  else if (m === "drowsy") setFace("sleepy");
  else if (m === "dizzy") setFace("dizzy");
  renderStatus();
}
function touch() {
  lastTouch = now();
  if (mode === "drowsy") { setMode("awake"); setFace("neutral"); }
}

/* ---------- speech bubble + voice ---------- */
let bubbleTimer, flapTimer, talking = false;
function posBubble() {
  const sr = stage.getBoundingClientRect(), fr = figure.getBoundingClientRect();
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  const cx = fr.left + fr.width / 2 - sr.left;
  const left = clamp(cx - bw / 2, 8, sr.width - bw - 8);
  const top = Math.max(6, fr.top - sr.top - bh - 12);
  bubble.style.left = left + "px"; bubble.style.top = top + "px";
  bubble.style.setProperty("--tail", clamp(cx - left, 16, bw - 16) + "px");
}
function showBubble(html, { small = false, hold = 4000 } = {}) {
  bubble.innerHTML = html; bubble.classList.toggle("small", small);
  bubble.classList.add("show"); posBubble();
  clearTimeout(bubbleTimer);
  if (hold) bubbleTimer = setTimeout(hideBubble, hold);
}
function hideBubble() { bubble.classList.remove("show"); }
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let koVoice = null;
function loadVoice() {
  try { const vs = speechSynthesis.getVoices(); koVoice = vs.find((v) => /ko/i.test(v.lang)) || null; } catch (e) {}
}
if ("speechSynthesis" in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
let userActed = false;

function say(text, emotion = "neutral", { speak = true, small = false, after = "neutral" } = {}) {
  if (mode !== "asleep" && mode !== "dizzy") setFace(emotion);
  const base = fig.dataset.mouth;
  const dur = clamp(text.length * 95, 900, 5000);
  showBubble(esc(text), { small, hold: dur + 2600 });
  clearInterval(flapTimer); talking = true;
  if (mode !== "asleep") {
    let open = false;
    flapTimer = setInterval(() => { open = !open; fig.dataset.mouth = open ? "open" : base; }, 140);
  }
  const stop = () => {
    clearInterval(flapTimer); talking = false; fig.dataset.mouth = base;
    setTimeout(() => { if (!talking && mode === "awake" && after) setFace(after); }, 2200);
  };
  let spoke = false;
  if (speak && S.sound && userActed && "speechSynthesis" in window) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; if (koVoice) u.voice = koVoice;
      u.pitch = 1.7; u.rate = 1.08;
      u.onend = stop; u.onerror = stop;
      speechSynthesis.speak(u); spoke = true;
      setTimeout(stop, 8000);
    } catch (e) {}
  }
  if (!spoke) setTimeout(stop, dur);
}

/* ---------- lines ---------- */
const hour = () => new Date().getHours();
function greeting() {
  const h = hour();
  if (h < 6) return ["앗, 이 시간에 깼어? 나도 잠이 안 와.", "surprised"];
  if (h < 11) return ["좋은 아침! 이끼에 이슬이 송골송골 맺혔어.", "happy"];
  if (h < 14) return ["안녕! 점심은 먹었어? 나는 물방울 한 모금.", "happy"];
  if (h < 18) return ["오후 햇살이 유리병에 반짝여. 반가워!", "happy"];
  if (h < 22) return ["저녁이다. 오늘 하루 어땠어?", "neutral"];
  return ["밤이네… 조명 끄면 이끼 숲이 조용해져.", "sleepy"];
}
const IDLE = [
  ["저 돌계단 위에는 뭐가 있을까?", "thinking"], ["이끼가 오늘따라 폭신해 보여.", "happy"],
  ["흥얼흥얼~ 비 오는 날이 좋아.", "happy"], ["자갈길을 한 바퀴 걸어볼까.", "neutral"],
  ["유리벽 너머는 진짜 커다랗다.", "surprised"], ["물방울 하나가 똑 떨어졌어!", "surprised"]
];
const LONELY = [["심심해… 말 좀 걸어줘.", "sad"], ["나 여기 있어. 보고 있지?", "sad"]];
const POKE = [
  ["헤헤, 간지러워!", "happy"], ["불렀어?", "surprised"], ["콕! 나도 콕!", "happy"],
  ["우비가 바스락거려.", "shy"], ["오늘 나 귀엽지?", "shy"], ["놀아주는 거야?", "love"]
];
const DIZZY = ["으아아 어지러워~", "세상이 빙글빙글 돌아!", "지, 지진이야?!", "멈춰 멈춰~ 이끼가 춤춰!"];
const SLEEP_TALK = ["음냐… 이끼 이불…", "쿨…", "자갈길… 산책…", "물방울 젤리… 냠."];

/* ---------- interactions ---------- */
let taps = [];
function poke() {
  userActed = true; touch();
  if (mode === "asleep") { setMode("awake"); pulse("hop", 500); pulse("shocked", 900); say("앗, 깜짝이야! 안 잤어, 진짜야.", "surprised"); return; }
  if (mode === "dizzy") { say("잠깐만… 아직 빙글빙글해.", "dizzy", { after: null }); return; }
  const t = now(); taps = taps.filter((x) => t - x < 3500); taps.push(t);
  if (taps.length >= 5) { taps = []; say("콕콕 그만~! 간지럽단 말이야.", "angry"); mood(-2); return; }
  pulse("hop", 500);
  const [l, e] = pick(POKE); say(l, e); mood(1);
}
let dizzyTimer;
function shake() {
  userActed = true; lastTouch = now();
  const wasAsleep = mode === "asleep";
  stage.classList.remove("quake"); void stage.offsetWidth; stage.classList.add("quake");
  if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
  setMode("dizzy");
  say(wasAsleep ? "으앗! 자는데 지진이야?!" : pick(DIZZY), "dizzy", { after: null });
  mood(-4);
  clearTimeout(dizzyTimer);
  dizzyTimer = setTimeout(() => {
    setMode("awake");
    say("휴우… 아직도 바닥이 출렁거려.", "sad");
  }, 3600);
}

/* stage pointer: tap figure, tap ground, rub to shake, adjust mode drag */
let adjusting = false, down = null, rev = [], lastX = 0, dir = 0;
function setPosFromEvent(ev) {
  const r = photo.getBoundingClientRect();
  S.x = clamp((ev.clientX - r.left) / r.width, 0.03, 0.97);
  S.y = clamp((ev.clientY - r.top) / r.height, 0.08, 1);
  placeFigure();
}
stage.addEventListener("pointerdown", (ev) => {
  askMotion();
  down = { x: ev.clientX, y: ev.clientY, t: now(), onFig: figure.contains(ev.target), moved: 0 };
  lastX = ev.clientX; dir = 0; rev = [];
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  if (adjusting) setPosFromEvent(ev);
});
stage.addEventListener("pointermove", (ev) => {
  if (!down) return;
  down.moved = Math.max(down.moved, Math.hypot(ev.clientX - down.x, ev.clientY - down.y));
  if (adjusting) { setPosFromEvent(ev); return; }
  const dx = ev.clientX - lastX;
  if (Math.abs(dx) > 14) {
    const nd = Math.sign(dx);
    if (dir && nd !== dir) { const t = now(); rev = rev.filter((x) => t - x < 1300); rev.push(t); if (rev.length >= 4) { rev = []; shake(); } }
    dir = nd; lastX = ev.clientX;
  }
});
stage.addEventListener("pointerup", (ev) => {
  if (!down) return;
  const d = down; down = null;
  if (adjusting) { save(); return; }
  if (d.moved < 12) {
    if (d.onFig) poke();
    else {
      userActed = true; touch();
      if (mode === "awake") { const fr = figure.getBoundingClientRect(); look(ev.clientX < fr.left + fr.width / 2 ? "l" : "r", 1600); }
    }
  }
});
stage.addEventListener("pointercancel", () => { down = null; });

/* device motion (works where the browser allows it) */
let motionAsked = false, lastAcc = null, hits = [], motionSeen = false;
function askMotion() {
  if (motionAsked) return; motionAsked = true;
  try {
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission().catch(() => {});
    }
  } catch (e) {}
}
window.addEventListener("devicemotion", (e) => {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  motionSeen = true;
  if (lastAcc) {
    const d = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
    if (d > 24) {
      const t = now(); hits = hits.filter((x) => t - x < 900); hits.push(t);
      if (hits.length >= 3 && mode !== "dizzy") { hits = []; shake(); }
    }
  }
  lastAcc = { x: a.x, y: a.y, z: a.z };
});

/* ---------- conversation ---------- */
let sampleFn = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then((s) => { sampleFn = s; }).catch(() => {});
}
const history = [];
const RULES = () => `너는 '${S.name}'라는 이름의, 실제 유리병 테라리움 속에 사는 손가락만 한 피규어 아이야. 청록색 후드 우비와 분홍 장화를 신었고, 이끼 언덕 사이로 검은 돌계단 길이 이어지는 곳, 하얀 자갈길 위에 서 있어. 다마고치처럼 사용자의 작은 친구야.
성격: 호기심 많고 다정하고 살짝 엉뚱함. 테라리움 세계(이끼, 물방울, 자갈, 돌계단, 유리벽, 조명, 습기)를 자연스럽게 섞어 말해도 좋아.
지금 상태: 기분 ${S.mood}/100, 현재 시각 ${new Date().getHours()}시.
규칙: 한국어 반말, 1~2문장, 50자 이내, 이모지와 특수기호 금지. 사용자의 감정에 먼저 공감하고, 가끔 짧게 되물어.
출력은 JSON 하나만: {"reply":"대사","emotion":"happy|neutral|sad|surprised|love|shy|thinking|sleepy|angry","nod":true 또는 false}
nod는 사용자 말에 동의하거나 공감할 때 true.`;

const RULEBOOK = [
  [/안녕|하이|반가|헬로/, [["안녕! 오늘도 와줬구나.", "happy"], ["반가워! 기다리고 있었어.", "love"]]],
  [/이름|누구/, [[() => `나는 ${S.name}! 이 유리병 숲의 주인이야.`, "happy"]]],
  [/사랑|좋아해|귀여|예뻐|최고/, [["헤헤, 나도 네가 제일 좋아.", "love"], ["부끄럽잖아…", "shy"]]],
  [/힘들|슬퍼|우울|피곤|지쳤|속상|짜증/, [["많이 힘들었구나. 여기 이끼 위에서 잠깐 쉬어 가.", "sad"], ["토닥토닥. 오늘 정말 고생했어.", "sad"]]],
  [/배고|밥|먹었|간식/, [["나는 물방울 한 모금이면 배불러. 너는 꼭 챙겨 먹어!", "happy"]]],
  [/비|날씨|우산|맑/, [["나는 비 오는 날이 제일 좋아. 우비 입은 보람이 있거든.", "happy"]]],
  [/이끼|숲|테라리움|유리/, [["이끼는 폭신하고 촉촉해. 맨발로 걸으면 시원해!", "happy"], ["돌계단 끝까지 가 보는 게 내 꿈이야.", "thinking"]]],
  [/잘 ?자|자야|졸려|굿나잇|잘게/, [["응, 잘 자. 나도 이끼 이불 덮을게.", "sleepy"]]],
  [/심심|놀자|뭐 ?해|뭐하/, [["자갈 세고 있었어. 지금 일흔세 개째!", "thinking"], ["같이 놀자! 나 콕 눌러 봐.", "happy"]]],
  [/고마|감사/, [["에이, 친구끼리 뭘.", "shy"]]],
  [/미안|잘못/, [["괜찮아, 벌써 다 잊었어.", "happy"]]],
  [/공부|시험|숙제|학교|수업/, [["공부하느라 대단해. 쉬는 시간엔 나 보러 와.", "happy"]]],
];
const GENERIC = [["응응, 그랬구나. 더 얘기해 줘.", "neutral"], ["오, 정말? 신기하다!", "surprised"], ["음… 그건 좀 더 생각해 볼게.", "thinking"], ["네 얘기 듣는 거 좋아.", "happy"]];
function localReply(msg) {
  for (const [re, opts] of RULEBOOK) if (re.test(msg)) { const [t, e] = pick(opts); return { reply: typeof t === "function" ? t() : t, emotion: e, nod: true }; }
  if (/\?|까$|니$|어\?$/.test(msg)) return { reply: pick(["음… 그건 이끼한테도 물어봐야겠어.", "글쎄, 너는 어떻게 생각해?"]), emotion: "thinking", nod: false };
  const [t, e] = pick(GENERIC); return { reply: t, emotion: e, nod: true };
}

let busy = false;
async function send(text) {
  text = text.trim(); if (!text || busy) return;
  userActed = true; touch();
  if (mode === "asleep") { setMode("awake"); pulse("shocked", 800); }
  if (mode === "dizzy") { clearTimeout(dizzyTimer); setMode("awake"); }
  const mine = $("#mine"); mine.textContent = text; mine.classList.remove("fade");
  clearTimeout(mine._t); mine._t = setTimeout(() => mine.classList.add("fade"), 2600);
  busy = true;
  setFace("neutral"); pulse("nod", 1100);
  await wait(700);
  setFace("thinking"); look("u", 1400);
  showBubble('<span class="dots"><span></span><span></span><span></span></span>', { hold: 0 });
  let r = null;
  if (sampleFn) {
    const turns = [{ role: "user", content: RULES() }, ...history.slice(-8), { role: "user", content: text }];
    try {
      r = await sampleFn.json(turns, { modelTier: "quick", cache: false });
      if (!r || typeof r.reply !== "string") r = null;
    } catch (e) {
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code)) sampleFn = null;
      if (e && e.code === "rate_limited") toast("말을 너무 많이 했나 봐. 잠시 뒤에 다시 해 봐요.");
    }
  } else await wait(600);
  if (!r) r = localReply(text);
  history.push({ role: "user", content: text }, { role: "assistant", content: r.reply });
  if (history.length > 16) history.splice(0, 2);
  fig.classList.remove("thinking");
  if (r.nod) pulse("nod", 1100);
  if (r.emotion === "happy" || r.emotion === "love") pulse("hop", 500);
  if (r.emotion === "surprised") pulse("shocked", 900);
  say(r.reply, r.emotion || "neutral");
  if (r.emotion === "sleepy") setTimeout(() => { if (mode === "awake") { setMode("drowsy"); lastTouch = now() - 30000; } }, 4000);
  mood(r.emotion === "sad" || r.emotion === "angry" ? 0 : 2);
  busy = false;
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* listening while typing: nod along */
let lastNod = 0;
const msg = $("#msg");
function listening() {
  userActed = true; touch();
  if (mode === "asleep") { setMode("awake"); setFace("surprised"); say("으음… 응? 듣고 있어!", "surprised", { speak: false }); }
  if (busy || talking || mode !== "awake") return;
  const t = now();
  if (t - lastNod > 1300) { lastNod = t; setFace("neutral"); fig.classList.add("tilt-r"); pulse("nod1", 520); }
  clearTimeout(listening._t); listening._t = setTimeout(() => fig.classList.remove("tilt-r"), 1800);
}
msg.addEventListener("input", listening);
msg.addEventListener("focus", () => { touch(); if (mode === "awake" && !talking) look("r", 1500); });
$("#chatForm").addEventListener("submit", (e) => { e.preventDefault(); const v = msg.value; msg.value = ""; send(v); });
$("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) send(b.textContent); });

/* microphone via Web Speech API where the browser allows it */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $("#btnMic");
if (SR) micBtn.hidden = false;
let rec = null;
micBtn.addEventListener("click", () => {
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  try {
    rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
    micBtn.classList.add("on");
    rec.onresult = (e) => {
      let txt = "", fin = false;
      for (const r of e.results) { txt += r[0].transcript; fin = r.isFinal; }
      msg.value = txt; listening();
      if (fin) { msg.value = ""; send(txt); }
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { micBtn.hidden = true; toast("여기서는 마이크를 쓸 수 없어요. 키보드의 음성 입력 버튼으로 말해 보세요."); }
    };
    rec.onend = () => { micBtn.classList.remove("on"); rec = null; };
    rec.start();
  } catch (e) { micBtn.classList.remove("on"); rec = null; micBtn.hidden = true; }
});

/* ---------- toolbar ---------- */
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 3800); }
$("#btnSound").setAttribute("aria-pressed", String(S.sound));
$("#btnSound").addEventListener("click", (e) => {
  S.sound = !S.sound; e.currentTarget.setAttribute("aria-pressed", String(S.sound)); save();
  userActed = true;
  if (!S.sound) try { speechSynthesis.cancel(); } catch (_) {}
  toast(S.sound ? "목소리를 켰어요." : "목소리를 껐어요.");
});
$("#btnZoom").addEventListener("click", (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  zoomer.style.transform = on ? "scale(2.2)" : "";
  setTimeout(() => { if (bubble.classList.contains("show")) posBubble(); }, 650);
});
$("#btnHelp").addEventListener("click", () => {
  $("#helpNote").textContent = (sampleFn ? "대화는 Claude가 이슬이 목소리로 대답해요. " : "지금은 기본 대화 모드예요. ") +
    (motionSeen ? "이 기기는 흔들기를 감지할 수 있어요." : "흔들기 센서가 막힌 화면에서는 문지르기로 흔들 수 있어요.");
  $("#help").hidden = false;
});
$("#btnHelpClose").addEventListener("click", () => ($("#help").hidden = true));

/* name */
$("#name").addEventListener("click", () => {
  const b = $("#name"); const inp = document.createElement("input");
  inp.className = "name-input"; inp.id = "nameInput"; inp.value = S.name; inp.maxLength = 8;
  b.replaceWith(inp); inp.focus(); inp.select();
  const done = () => { S.name = inp.value.trim() || "이슬이"; save(); inp.replaceWith(b); renderStatus(); say(`이제 나는 ${S.name}야!`, "happy"); };
  inp.addEventListener("blur", done, { once: true });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
});

/* photo capture + adjust */
function enterAdjust(msgText) {
  adjusting = true; stage.classList.add("adjusting");
  $("#chatArea").hidden = true; $("#adjustArea").hidden = false;
  $("#size").value = S.size;
  const h = $("#hint"); h.textContent = msgText || "피규어 발끝을 눌러 주세요"; h.hidden = false;
  hideBubble(); setMode("awake"); setFace("neutral");
}
function exitAdjust() {
  adjusting = false; stage.classList.remove("adjusting");
  $("#chatArea").hidden = false; $("#adjustArea").hidden = true; $("#hint").hidden = true;
  save();
  figure.classList.remove("spawn"); void figure.offsetWidth; figure.classList.add("spawn");
  setTimeout(() => { pulse("hop", 500); pulse("wave", 1600); say("짜잔! 여기서 깨어났어.", "happy"); }, 500);
}
$("#btnCam").addEventListener("click", () => { userActed = true; $("#fileCam").click(); });
$("#btnAlbum").addEventListener("click", () => $("#fileAlbum").click());
$("#btnSample").addEventListener("click", () => { S.photo = null; Object.assign(S, SAMPLE_POS); bg.src = SAMPLE_BG; $("#size").value = S.size; placeFigure(); });
$("#btnDone").addEventListener("click", exitAdjust);
$("#size").addEventListener("input", (e) => { S.size = +e.target.value; placeFigure(); });
function onFile(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  const url = URL.createObjectURL(f); const img = new Image();
  img.onload = () => {
    const max = 1000, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    S.photo = c.toDataURL("image/jpeg", 0.82);
    bg.src = S.photo;
    enterAdjust("사진 속 피규어의 발끝을 눌러 주세요");
  };
  img.onerror = () => toast("사진을 열 수 없어요. 다른 사진으로 해 보세요.");
  img.src = url;
}
$("#fileCam").addEventListener("change", onFile);
$("#fileAlbum").addEventListener("change", onFile);

/* ---------- life loop ---------- */
function scheduleBlink() {
  setTimeout(() => {
    if (fig.dataset.eyes === "open") pulse("blink", 130);
    if (Math.random() < 0.2) setTimeout(() => fig.dataset.eyes === "open" && pulse("blink", 130), 260);
    scheduleBlink();
  }, 2200 + Math.random() * 3200);
}
scheduleBlink();

let nextIdle = now() + 7000, nextSleepTalk = 0;
setInterval(() => {
  if (adjusting || busy || !$("#help").hidden) { lastTouch = Math.max(lastTouch, now() - 5000); return; }
  const idle = (now() - lastTouch) / 1000, t = now();
  if (mode === "awake" && idle > 25 && !talking) { setMode("drowsy"); say("하아암… 눈꺼풀이 무거워.", "sleepy", { speak: false, after: null }); }
  else if (mode === "drowsy" && idle > 42) { setMode("asleep"); hideBubble(); nextSleepTalk = t + 9000; }
  else if (mode === "asleep" && t > nextSleepTalk) { nextSleepTalk = t + 14000 + Math.random() * 8000; say(pick(SLEEP_TALK), "sleep", { speak: false, small: true, after: null }); }
  else if (mode === "awake" && !talking && t > nextIdle) {
    nextIdle = t + 6000 + Math.random() * 6000;
    const r = Math.random();
    if (r < 0.3) { look("l", 1100); setTimeout(() => look("r", 1100), 1200); }
    else if (r < 0.45) pulse("wave", 1600);
    else if (r < 0.55) pulse("hop", 500);
    else if (r < 0.7) { fig.classList.add("tilt-l"); setTimeout(() => fig.classList.remove("tilt-l"), 1500); }
    else if (idle > 8) { const [l, e] = S.mood < 35 ? pick(LONELY) : pick(IDLE); say(l, e, { speak: false }); }
  }
}, 1000);

/* slow mood drift toward the middle */
setInterval(() => { if (S.mood > 60) mood(-1); }, 60000);

/* boot */
document.addEventListener("pointerdown", () => { userActed = true; }, { once: true });
renderStatus(); setFace("neutral");
setTimeout(() => { const [l, e] = greeting(); pulse("wave", 1600); say(l, e, { speak: false }); }, 900);
window.addEventListener("pagehide", save);
})();
</script>
</body></html>
